<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox Monitor | Qinamical</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ff6d5a; /* Tu color coral */
            --bg-body: #f8fafc;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body);
            color: #334155;
        }
        
        .header-section {
            background: white;
            padding: 2rem 0;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 2rem;
        }

        /* Estilo de las Cards de Correo */
        .email-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .email-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: var(--primary-color);
        }
        
        .id-badge {
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .sender-name {
            font-weight: 600;
            color: #1e293b;
        }

        .subject-line {
            color: #475569;
            font-weight: 500;
        }

        .date-text {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .message-preview {
            font-size: 0.9rem;
            color: #64748b;
            border-left: 3px solid #f1f5f9;
            padding-left: 1rem;
            margin-top: 0.5rem;
        }

        /* Indicador de actualización */
        .refresh-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header class="header-section shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-envelope-paper-fill text-primary me-2"></i>Inbox Monitor
                </h2>
                <div id="status" class="small text-muted mt-1">
                    <span class="refresh-dot"></span>Sincronizando con n8n...
                </div>
            </div>
            <button onclick="obtenerDatos()" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-clockwise"></i> Refrescar
            </button>
        </div>
    </header>

    <main class="container mb-5">
        <div id="inbox-container">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3">Cargando correspondencia...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const N8N_WEB_HOOK_URL = 'https://qinamical.app.n8n.cloud/webhook/emails';

        async function obtenerDatos() {
            try {
                const response = await fetch(N8N_WEB_HOOK_URL);
                const datos = await response.json();
                
                // Ordenar por ID descendente
                datos.sort((a, b) => b.ID - a.ID);

                const container = document.getElementById('inbox-container');
                container.innerHTML = ''; 

                datos.forEach(correo => {
                    // Ajuste de hora (+1 hora)
                    let fechaObj = new Date(correo.Fecha);
                    fechaObj.setHours(fechaObj.getHours() + 1);
                    const fechaFinal = fechaObj.toLocaleString('es-ES', { 
                        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' 
                    });

                    // Limitar texto a 120 caracteres para el monitor
                    const textoCorto = correo.Texto && correo.Texto.length > 120 
                        ? correo.Texto.substring(0, 120) + '...' 
                        : (correo.Texto || 'Sin contenido');

                    const card = `
                        <div class="email-card shadow-sm animate__animated animate__fadeInUp">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="id-badge">#${correo.ID}</span>
                                <span class="date-text"><i class="bi bi-clock me-1"></i>${fechaFinal}</span>
                            </div>
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="sender-name text-truncate">
                                        <i class="bi bi-person-circle me-2 text-primary"></i>${correo.Remitente}
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <div class="subject-line text-truncate">
                                        ${correo.Asunto || '(Sin Asunto)'}
                                    </div>
                                </div>
                            </div>
                            <div class="message-preview mt-3">
                                ${textoCorto}
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
                
                document.getElementById('status').innerHTML = `<span class="refresh-dot"></span>Última actualización: ${new Date().toLocaleTimeString()}`;

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').innerHTML = '<span class="text-danger">Error de conexión</span>';
            }
        }
        // Refresco automático cada 30 segundos para no saturar
        //setInterval(obtenerDatos, 30000); 
        obtenerDatos();
    </script>
</body>
</html>
